; 86Box machine for the test harness with CPU=486: the IBM PS/2 Model 30
; 286 of 86box.cfg, which says why each line is as it is, with IBM's
; 486SLC3 at 100 MHz in place of the 286 and a 387 in place of the 287.
; The machine's BIOS and CMOS memory take it as they are.  86Box
; interprets this processor as it does the 286: what is made on the
; system comes out the same, in less than half the time.  It is not a
; 286, and proves nothing of one.

[General]
vid_renderer = qt_software

[Machine]
machine = ibmps2_m30_286
cpu_family = ibm486slc3
cpu_multi = 3
cpu_speed = 100000000
cpu_use_dynarec = 0
fpu_type = 387
mem_size = 4096
time_sync = utc

[Video]
gfxcard = internal

[Input devices]
keyboard_type = keyboard_ps2
mouse_type = none

[Storage controllers]
hdc_1 = ide_isa

[Floppy and CD-ROM drives]
fdd_01_type = 35_2hd
fdd_01_turbo = 1
fdd_02_type = none
