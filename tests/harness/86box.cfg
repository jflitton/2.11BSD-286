; 86Box machine for the test harness: an IBM PS/2 Model 30 286, 10 MHz 286
; with a 287, 4 MB and one 1.44 MB diskette drive.  tests/harness/runtest.py
; copies this to the test's directory and adds the diskette image, which is
; why the diskette drives come last, and what COM1 is connected to.
;
; hdc_1 must be named: left out, the machine's built-in disk controller is
; used and the BIOS stops at an error for want of a drive on it.
;
; ibmps2_m30_286.nvr is this machine's CMOS memory, as the "automatic
; configuration" of the machine's Starter Diskette leaves it.  Without it,
; or with the machine changed here, the BIOS stops at error 162 and waits
; for F1.

[General]
vid_renderer = qt_software

[Machine]
machine = ibmps2_m30_286
cpu_family = 286
cpu_multi = 1
cpu_speed = 10000000
cpu_use_dynarec = 0
fpu_type = 287
mem_size = 4096

[Video]
gfxcard = internal

[Input devices]
keyboard_type = keyboard_ps2
mouse_type = none

[Storage controllers]
hdc_1 = ide_isa

[Floppy and CD-ROM drives]
fdd_01_type = 35_2hd
fdd_01_turbo = 1
fdd_02_type = none
