# The root file system of the system for the 286: tools/mkfs.py makes it
# (`make -C usr/src/i286 root`).  Files are named relative to this
# directory: the programs as obj/bin has them, the kernel and /boot as
# their own Makefiles make them, /etc from ../etc (upstream's) or etc
# (this port's own), and what the Makefile makes in obj/root.
d /bin 755
d /sbin 755
d /etc 755
d /dev 755
d /tmp 1777
d /root 755
d /usr 755
d /usr/bin 755
d /usr/libexec 755
d /usr/adm 755
d /usr/tmp 1777
d /var 755
d /var/run 755
f /unix 644 ../../../obj/PC/unix
f /boot 644 ../../../obj/stand/boot
f /etc/init 700 ../../../obj/bin/init
f /etc/rc 644 etc/rc
f /etc/ttys 644 etc/ttys
f /etc/fstab 644 etc/fstab
f /etc/motd 644 etc/motd
f /etc/gettytab 644 ../etc/gettytab
f /etc/master.passwd 600 ../etc/master.passwd
f /etc/group 644 ../etc/group
f /etc/shells 644 ../etc/shells
