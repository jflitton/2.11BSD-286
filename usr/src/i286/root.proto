# The root file system of the system for the 286: tools/mkfs.py makes it
# (`make -C usr/src/i286 root`).  Files are named relative to this
# directory: the programs from obj/root/bin, where the Makefile puts each
# of obj/bin's without its symbols, the kernel and /boot as their own
# Makefiles make them, /etc from ../etc (upstream's) or etc
# (this port's own), root's files from ../etc/root (upstream's) or root
# (this port's own), a new user's from skel (this port's own), and what
# the Makefile makes in obj/root.
