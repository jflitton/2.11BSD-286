# The machine's name and its network interface: /etc/rc reads this, and
# /etc/netstart sets the network up from it.  Set them for this machine.
# With no address the interface is left down, and only the loopback
# interface runs.  The address may be a name in /etc/hosts.
#
#	hostname	the machine's name
#	interface	ne0, the first NE1000 or NE2000 found
#	address		its Internet address
#	netmask		its network's mask
#	gateway		where packets for other networks go

# hostname=pc286.example.com
interface=ne0
# address=192.168.0.40
netmask=255.255.255.0
# gateway=192.168.0.1
