#
# What inetd starts, as upstream's has it: the
# daemons that log a user in or run a command go through tcpd, which
# lets a connection through or not by /etc/hosts.allow and
# /etc/hosts.deny.  popper, the POP3 server, which upstream's does not
# start, is here to be turned on; it needs a line "pop3 110/tcp" in
# /etc/services, which upstream's lacks.
#
ftp	stream	tcp	nowait	root	/usr/libexec/tcpd	ftpd -l
telnet	stream	tcp	nowait	root	/usr/libexec/tcpd	telnetd
shell	stream	tcp	nowait	root	/usr/libexec/tcpd	rshd
login	stream	tcp	nowait	root	/usr/libexec/tcpd	rlogind
#exec	stream	tcp	nowait	root	/usr/libexec/rexecd	rexecd
finger	stream	tcp	nowait	nobody	/usr/libexec/fingerd	fingerd -s -l
comsat	dgram	udp	wait	root	/usr/libexec/comsat	comsat
#pop3	stream	tcp	nowait	root	/usr/libexec/tcpd	popper
#tftp	dgram	udp	wait	nobody	/usr/libexec/tcpd	tftpd
#ntalk	dgram	udp	wait	root	/usr/libexec/ntalkd	ntalkd
echo	stream	tcp	nowait	root	internal
#discard	stream	tcp	nowait	root	internal
#chargen	stream	tcp	nowait	root	internal
#daytime	stream	tcp	nowait	root	internal
tcpmux	stream	tcp	nowait	root	internal
tcpmux/+date	stream	tcp	nowait	nobody	/bin/date	date
#time	stream	tcp	nowait	root	internal
echo	dgram	udp	wait	root	internal
#discard	dgram	udp	wait	root	internal
#chargen	dgram	udp	wait	root	internal
#daytime	dgram	udp	wait	root	internal
time	dgram	udp	wait	root	internal
