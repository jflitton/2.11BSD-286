# The machine's name and its network interface: /etc/rc reads this, and
# /etc/netstart sets the network up from it.  Set them for this machine.
# With no address the interface is left down, and only the loopback
# interface runs.  The address may be a name in /etc/hosts.
#
#	hostname	the machine's name
#	interface	ne0, the first NE1000 or NE2000 found
#	address		its Internet address
#	netmask		its network's mask
#	gateway		where packets for other networks go

# hostname=pc286.example.com
interface=ne0
# address=192.168.0.40
netmask=255.255.255.0
# gateway=192.168.0.1

# A serial line to one other machine, by SLIP (slattach): sl0.  With no
# sladdress the line is left as /etc/ttys has it, which must have it off.
#
#	slline		the serial port: tty01, COM2
#	slspeed		its speed: 9600; faster, a port with no FIFO, as a
#			PS/2's is, loses characters (docs/network.md)
#	sladdress	this machine's address on the line
#	sldest		the address of the machine at its other end

slline=tty01
slspeed=9600
# sladdress=192.168.1.1
# sldest=192.168.1.2

# The network's daemons that /etc/rc starts besides inetd, each YES or
# NO.  routed is given routedflags, and timed timedflags (-M, to be the
# network's master if there is no other).
#
#	rwhod		tells the network who is logged in here, and keeps
#			what the other machines tell, for rwho and ruptime
#	routed		keeps the routes with the network's other routers
#	named		the name server: answers for the domains that
#			/etc/named.boot gives it, and looks up others for
#			this machine's programs; without it they ask the
#			server /etc/resolv.conf names, if any, and then
#			read /etc/hosts
#	timed		keeps the clock with the network's other timeds
#	ntpd		keeps the clock with /etc/ntp.conf's peers
#	sendmail	takes mail from other machines by SMTP, and each
#			hour tries again to deliver what is in its queue;
#			without it mail is still sent and delivered, and
#			/etc/crontab has the queue tried each hour

rwhod=NO
routed=NO
routedflags=-q
named=NO
timed=NO
timedflags=
ntpd=NO
sendmail=NO
